<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaCare Campus – Programmes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/programmes.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-logo"><div class="logo-icon">V</div><span>VitaCare Campus Admin</span></div>
        <nav class="nav-menu">
            <a href="admin.html" class="nav-item"><i class="fas fa-th-large"></i> Vue d'ensemble</a>
            <a href="reservations.html" class="nav-item"><i class="far fa-calendar-check"></i> Réservations</a>
            <a href="programmes.html" class="nav-item active"><i class="fas fa-pulse"></i> Programmes</a>
            <a href="gestpracticiens.html" class="nav-item"><i class="fas fa-user-md"></i> Intervenants</a>
            <a href="gestetudiants.html" class="nav-item"><i class="fas fa-graduation-cap"></i> Étudiants</a>
            <a href="stats.html" class="nav-item"><i class="far fa-chart-bar"></i> Rapports statistiques</a>
        </nav>
    </aside>

    <div class="main-container">
        <header class="top-bar">
            <div></div>
            <div class="profile-area">
                <div class="bell-icon"><i class="far fa-bell"></i><span class="bell-badge">3</span></div>
                <div class="user-meta">
                    <div class="avatar-circle">AD</div>
                    <span>Administrateur</span>
                </div>
            </div>
        </header>

        <main class="content-body admin-scroll-layout">
            <div class="page-header-block">
                <h1 class="page-title">Programmes et activités</h1>
                <p class="page-subtitle">Liste des ateliers, cours et événements</p>
            </div>

            <!-- Barre de recherche -->
            <div class="filters-panel">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher par nom, description, intervenant...">
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Date / Heure</th>
                            <th>Capacité max</th>
                            <th>Lieu</th>
                            <th>Intervenant</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="js/programmes.js"></script>
</body>
</html>
