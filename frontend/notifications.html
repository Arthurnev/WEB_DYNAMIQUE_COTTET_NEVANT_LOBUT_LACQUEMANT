<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Notifications - VitaCare Campus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

<div class="student-app">
    <aside class="student-sidebar">
        <div class="student-brand">
            <div class="brand-icon">V</div>
            <strong>VitaCare Campus</strong>
        </div>
        <nav class="student-menu">
            <a href="index.html">▦ Dashboard</a>
            <a href="catalogue.html">📖 Catalogue</a>
            <a href="suivi_historique.html">📅 Suivi & historique</a>
            <a href="activites.html">〽 Activités</a>
            <a href="notifications_etudiant.html" class="active">🔔 Notifications <span id="sidebar-notif-count" class="badge">0</span></a>
        </nav>
        <div class="student-help">
            <div class="help-icon">?</div>
            <strong>Besoin d'aide ?</strong>
            <p>Notre équipe est là pour vous aider.</p>
            <a href="aide_etudiant.html">Nous contacter</a>
        </div>
    </aside>

    <main class="student-main">
        <header class="student-topbar">
            <div class="student-actions">
                <div class="notif-dropdown-container">
                    <button class="notif-bell" id="notif-bell" type="button">
                        <i class="fas fa-bell"></i>
                        <span id="topbar-notif-count" style="display:none;">0</span>
                    </button>
                    <div class="notif-dropdown" id="notif-dropdown">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button id="markAllReadBtn">Tout marquer comme lu</button>
                        </div>
                        <div class="notif-dropdown-list" id="notif-dropdown-list">
                            <div style="padding:20px; text-align:center;">Chargement...</div>
                        </div>
                        <div class="notif-dropdown-footer">
                            <a href="notifications_etudiant.html">Voir toutes les notifications</a>
                        </div>
                    </div>
                </div>
                <a href="panier.html" class="cart-link">🛒</a>
                <div class="account-wrapper">
                    <button class="avatar-button" onclick="toggleAccountMenu()">
                        <div class="student-avatar" id="studentAvatar"></div>
                    </button>
                    <strong id="studentName"></strong>
                    <div class="account-menu hidden" id="accountMenu">
                        <a href="compte.html">⚙️ Mon compte</a>
                        <button class="logout-btn" onclick="logout()">🚪 Déconnexion</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="notif-page-container">
                <div class="page-header">
                    <h1>Notifications</h1>
                    <p class="subtitle" id="unread-count-text">0 notification non lue</p>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
                    <div class="notif-filters">
                        <button class="filter-btn active" data-filter="all">Toutes</button>
                        <button class="filter-btn" data-filter="rappel">Rappels</button>
                        <button class="filter-btn" data-filter="confirmation">Confirmations</button>
                        <button class="filter-btn" data-filter="annulation">Annulations</button>
                        <button class="filter-btn" data-filter="info">Informations</button>
                    </div>
                    <button class="mark-all-read" onclick="marquerToutLu()">Tout marquer comme lu</button>
                </div>

                <div id="notifications-list" class="notif-list">
                    <div style="text-align:center; padding:40px;">Chargement...</div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    let allNotifications = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        document.getElementById("studentName").textContent = user.prenom + " " + user.nom;
        document.getElementById("studentAvatar").textContent = (user.prenom ? user.prenom[0] : "") + (user.nom ? user.nom[0] : "");
        
        await chargerNotifications();
        initNotifications();
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                afficherNotifications();
            });
        });
    });

    function initNotifications() {
        const bell = document.getElementById('notif-bell');
        const dropdown = document.getElementById('notif-dropdown');
        const markAllBtn = document.getElementById('markAllReadBtn');
        
        chargerNotifications();
        
        if (bell && dropdown) {
            bell.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdown.classList.toggle('open');
                if (dropdown.classList.contains('open')) {
                    chargerNotifications();
                }
            });
            document.addEventListener('click', function(e) {
                if (!bell.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('open');
                }
            });
        }
        if (markAllBtn) {
            markAllBtn.onclick = marquerToutLu;
        }
    }

    async function chargerNotifications() {
        try {
            const res = await fetch('../backend/notifications.php', { credentials: 'include' });
            const data = await res.json();
            
            if (data.success) {
                allNotifications = data.notifications;
                mettreAJourCompteurs();
                afficherNotifications();
                afficherDropdownNotifications();
            } else {
                document.getElementById('notifications-list').innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><p>Erreur: ${data.error}</p></div>`;
            }
        } catch (error) {
            document.getElementById('notifications-list').innerHTML = `<div class="empty-state"><i class="fas fa-wifi"></i><p>Erreur de connexion</p></div>`;
        }
    }

    function afficherNotifications() {
        const container = document.getElementById('notifications-list');
        let filtered = allNotifications;
        
        if (currentFilter !== 'all') {
            filtered = allNotifications.filter(n => n.type === currentFilter);
        }
        
        const nonLues = allNotifications.filter(n => n.lu == 0).length;
        const unreadText = document.getElementById('unread-count-text');
        if (unreadText) {
            unreadText.textContent = nonLues + ' notification' + (nonLues > 1 ? 's' : '') + (nonLues === 0 ? ' non lue' : ' non lues');
        }
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><p>Aucune notification</p></div>`;
            return;
        }
        
        container.innerHTML = filtered.map(notif => {
            const estLu = notif.lu == 1;
            const cardClass = estLu ? 'notif-card read' : 'notif-card unread';
            let iconClass = 'info';
            let iconFa = 'fa-info-circle';
            
            switch(notif.type) {
                case 'rappel':
                    iconClass = 'rappel';
                    iconFa = 'fa-bell';
                    break;
                case 'confirmation':
                    iconClass = 'confirmation';
                    iconFa = 'fa-check-circle';
                    break;
                case 'annulation':
                    iconClass = 'annulation';
                    iconFa = 'fa-times-circle';
                    break;
                default:
                    iconClass = 'info';
                    iconFa = 'fa-info-circle';
            }
            
            const date = new Date(notif.date);
            const dateStr = date.toLocaleDateString('fr-FR');
            const heureStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            
            const titre = notif.message.length > 60 ? notif.message.substring(0, 60) + '...' : notif.message;
            
            return `
                <div class="${cardClass}" data-id="${notif.id}">
                    <div class="notif-icon ${iconClass}">
                        <i class="fas ${iconFa}"></i>
                    </div>
                    <div class="notif-content">
                        <div class="notif-title">${escapeHtml(titre)}</div>
                        <div class="notif-message">${escapeHtml(notif.message)}</div>
                        <div class="notif-date">
                            <i class="far fa-calendar"></i> ${dateStr} à ${heureStr}
                        </div>
                        ${!estLu ? `
                            <div class="notif-actions">
                                <button class="notif-action-btn" onclick="marquerCommeLu(${notif.id})">
                                    <i class="fas fa-check"></i> Marquer comme lu
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    ${!estLu ? '<div class="notif-dot"></div>' : ''}
                </div>
            `;
        }).join('');
    }

    function afficherDropdownNotifications() {
        const container = document.getElementById('notif-dropdown-list');
        if (!container) return;
        
        if (allNotifications.length === 0) {
            container.innerHTML = '<div style="padding:20px; text-align:center; color:#9ca3af;">Aucune notification</div>';
            return;
        }
        
        const recentes = [...allNotifications].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
        
        container.innerHTML = recentes.map(notif => {
            const estLu = notif.lu == 1;
            let bgColor = '#e5e7eb';
            let iconColor = '#4b5563';
            let iconFa = 'fa-info-circle';
            
            switch(notif.type) {
                case 'rappel':
                    bgColor = '#fef3c7';
                    iconColor = '#d97706';
                    iconFa = 'fa-bell';
                    break;
                case 'confirmation':
                    bgColor = '#d1fae5';
                    iconColor = '#065f46';
                    iconFa = 'fa-check-circle';
                    break;
                case 'annulation':
                    bgColor = '#fee2e2';
                    iconColor = '#dc2626';
                    iconFa = 'fa-times-circle';
                    break;
                default:
                    bgColor = '#e5e7eb';
                    iconColor = '#4b5563';
                    iconFa = 'fa-info-circle';
            }
            
            const date = new Date(notif.date);
            const dateStr = date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'numeric' });
            const heureStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            
            const titre = notif.message.length > 50 ? notif.message.substring(0, 50) + '...' : notif.message;
            
            return `
                <div class="notif-dropdown-item ${!estLu ? 'unread' : ''}" onclick="marquerCommeLu(${notif.id})">
                    <div class="notif-dropdown-icon ${notif.type === 'rappel' ? 'rappel' : notif.type === 'confirmation' ? 'confirmation' : notif.type === 'annulation' ? 'annulation' : 'info'}" style="background:${bgColor}; color:${iconColor}">
                        <i class="fas ${iconFa}"></i>
                    </div>
                    <div class="notif-dropdown-content">
                        <div class="notif-dropdown-title">${escapeHtml(titre)}</div>
                        <div class="notif-dropdown-message">${escapeHtml(notif.message.substring(0, 80))}</div>
                        <div class="notif-dropdown-date">${dateStr} à ${heureStr}</div>
                    </div>
                    ${!estLu ? '<div class="notif-dropdown-dot"></div>' : ''}
                </div>
            `;
        }).join('');
    }

    function mettreAJourCompteurs() {
        const nonLues = allNotifications.filter(n => n.lu == 0).length;
        
        const topbarBadge = document.getElementById('topbar-notif-count');
        if (topbarBadge) {
            if (nonLues > 0) {
                topbarBadge.textContent = nonLues;
                topbarBadge.style.display = 'inline-block';
            } else {
                topbarBadge.style.display = 'none';
            }
        }
        
        const sidebarBadge = document.getElementById('sidebar-notif-count');
        if (sidebarBadge) {
            if (nonLues > 0) {
                sidebarBadge.textContent = nonLues;
                sidebarBadge.style.display = 'inline-block';
            } else {
                sidebarBadge.style.display = 'none';
            }
        }
    }

    async function marquerCommeLu(id) {
        try {
            const res = await fetch('../backend/marquer_notification_lu.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ id: id })
            });
            const data = await res.json();
            if (data.success) {
                await chargerNotifications();
            }
        } catch (error) {
            console.error("Erreur:", error);
        }
    }

    async function marquerToutLu() {
        try {
            const res = await fetch('../backend/marquer_tout_lu.php', {
                method: 'POST',
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                await chargerNotifications();
            }
        } catch (error) {
            console.error("Erreur:", error);
        }
    }

    function toggleAccountMenu() {
        const menu = document.getElementById('accountMenu');
        if (menu) {
            menu.classList.toggle('hidden');
        }
    }

    function logout() {
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
