<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitaCare Campus — Inscription</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-container">

    <div class="auth-card register-card">

      <div class="auth-logo">
        <span class="logo-icon">💚</span>
        <h1>VitaCare <span>Campus</span></h1>
      </div>

      <p class="auth-subtitle">Créer mon compte</p>

      <div id="message" class="message hidden"></div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('etudiant', this)">Étudiant</button>
        <button class="tab" onclick="switchTab('praticien', this)">Praticien</button>
      </div>

      <div id="form-etudiant">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="nom-e" placeholder="Dupont">
        </div>

        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="prenom-e" placeholder="Julie">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email-e" placeholder="prenom@ece.fr">
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="password-e" placeholder="6 caractères minimum">
        </div>

        <button  class="btn-primary" onclick="registerEtudiant()">Créer mon compte</button>
      </div>

      <div id="form-praticien" style="display:none">

        <div class="form-row">
          <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="prenom-p" placeholder="Marie">
          </div>

          <div class="form-group">
            <label>Nom</label>
            <input type="text" id="nom-p" placeholder="Martin">
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email-p" placeholder="marie@vitacare.fr">
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="password-p" placeholder="6 caractères minimum">
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="text" id="telephone-p" placeholder="06 12 34 56 78">
        </div>

        <div class="form-group">
          <label>Adresse professionnelle</label>
          <input type="text" id="adresse-p" placeholder="45 Avenue de la Santé">
        </div>

        <div class="form-group">
          <label>Spécialité</label>
          <select id="specialite-p">
            <option value="">Sélectionnez une spécialité</option>
            <option value="medecine_generale">Médecine générale</option>
            <option value="psychologie">Psychologie</option>
            <option value="nutrition">Nutrition & Diététique</option>
            <option value="physiotherapie">Physiothérapie</option>
            <option value="sport">Coach sportif</option>
            <option value="bien_etre">Bien-être & Sophrologie</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Diplôme</label>
            <input type="text" id="diplome-p" placeholder="Doctorat en médecine">
          </div>

          <div class="form-group">
            <label>Numéro RPPS</label>
            <input type="text" id="rpps-p" placeholder="12345678901">
          </div>
        </div>

        <button class="btn-primary" onclick="registerPraticien()">Créer mon compte</button>
      </div>

      <p class="auth-link">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </p>

    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
