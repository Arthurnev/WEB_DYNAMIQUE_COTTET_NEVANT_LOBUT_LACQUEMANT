<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitaCare Campus — Connexion</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="auth-container">

    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">💚</span>
        <h1>VitaCare <span>Campus</span></h1>
      </div>

      <p class="auth-subtitle">Votre santé, notre priorité</p>

      <div id="message" class="message hidden"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="prenom@ece.fr">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="btn-primary" onclick="login()">Se connecter</button>

      <p class="auth-link">
        Pas encore de compte ? <a href="register.html">S'inscrire</a>
      </p>
    </div>

  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
