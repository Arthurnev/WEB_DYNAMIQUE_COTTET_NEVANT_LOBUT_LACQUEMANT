<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Détails du rendez-vous - VitaCare Campus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_praticien.css">

</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">V</div>
            <span class="brand-name">VitaCare <small>Campus</small></span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard_praticien.html"><i class="fas fa-th-large"></i> Tableau de bord</a>
            <a href="agenda_praticien.html" class="active"><i class="fas fa-calendar-alt"></i> Agenda</a>
            <a href="disponibilites_praticien.html"><i class="fas fa-clock"></i> Disponibilités</a>
            <a href="patients_praticien.html"><i class="fas fa-users"></i> Patients</a>
            <a href="activites_praticien.html"><i class="fas fa-heart"></i> Activités</a>
        </nav>
        <div class="sidebar-footer">
            <div class="help-box">
                <div class="help-icon"><i class="fas fa-question"></i></div>
                <strong>Besoin d'aide ?</strong>
                <p>Notre équipe est là pour vous aider.</p>
                <a href="#">Nous contacter</a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-right">
                <span class="icon-btn"><i class="fas fa-bell"></i></span>
                <div class="user-profile">
                    <div class="avatar" id="avatar-initials">MM</div>
                    <span class="user-name" id="user-name">Dr. Martin</span>
                </div>
            </div>
        </header>

        <div class="page-content">
            <button class="btn-back" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Retour à l'agenda
            </button>

            <div id="detailContainer" class="detail-container">
                <div style="text-align:center; padding:40px;">Chargement...</div>
            </div>
        </div>
    </main>
</div>

<!-- Modal ajout note -->
<div id="noteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-comment-medical"></i> Ajouter une note</h2>
            <button class="modal-close" id="closeNoteModalBtn">&times;</button>
        </div>
        <form id="noteForm">
            <div class="form-group">
                <label>Note / Commentaire</label>
                <textarea id="noteText" rows="5" placeholder="Observations, recommandations, notes sur la consultation..." required></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel-modal" id="cancelNoteModalBtn">Annuler</button>
                <button type="submit" class="btn-submit">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script>
    let rdvId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        document.getElementById("user-name").textContent = "Dr. " + user.nom;
        document.getElementById("avatar-initials").textContent = (user.prenom ? user.prenom[0] : "D") + user.nom[0];
        
        const urlParams = new URLSearchParams(window.location.search);
        rdvId = urlParams.get('id');
        
        if (!rdvId) {
            window.location.href = "agenda_praticien.html";
            return;
        }
        
        await chargerDetails();
        
        document.getElementById('closeNoteModalBtn').onclick = () => document.getElementById('noteModal').classList.remove('open');
        document.getElementById('cancelNoteModalBtn').onclick = () => document.getElementById('noteModal').classList.remove('open');
        document.getElementById('noteForm').onsubmit = ajouterNote;
        
        window.onclick = (event) => {
            if (event.target === document.getElementById('noteModal')) {
                document.getElementById('noteModal').classList.remove('open');
            }
        };
    });

    async function chargerDetails() {
        const container = document.getElementById('detailContainer');
        try {
            const res = await fetch(`../backend/details_rdv.php?id=${rdvId}`, { credentials: 'include' });
            const data = await res.json();
            
            if (!data.success) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:red;">Erreur: ${data.error}</div>`;
                return;
            }
            
            const rdv = data.rdv;
            const historique = data.historique || [];
            const note = data.note;
            
            const date = new Date(rdv.date);
            const dateStr = date.toLocaleDateString('fr-FR');
            const heureStr = rdv.heure_debut.substring(0,5);
            
            let historiqueHtml = '';
            if (historique.length > 0) {
                historiqueHtml = `
                    <div class="info-section">
                        <h3><i class="fas fa-history"></i> Historique</h3>
                        ${historique.map(h => `
                            <div class="historique-item">
                                <span class="historique-date">${new Date(h.date).toLocaleDateString('fr-FR')}</span>
                                <span>${escapeHtml(h.service_nom)}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            let noteHtml = '';
            if (note) {
                noteHtml = `
                    <div class="info-section">
                        <h3><i class="fas fa-sticky-note"></i> Note</h3>
                        <div class="note-text">
                            <i class="fas fa-quote-left" style="margin-right:8px; color:#2e8b57;"></i>
                            ${escapeHtml(note.commentaire)}
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = `
                <div class="detail-header">
                    <h1>Détails du rendez-vous</h1>
                    <p>${escapeHtml(rdv.service_nom || 'Consultation')}</p>
                </div>
                <div class="detail-body">
                    <div class="patient-info">
                        <div class="patient-avatar"><i class="fas fa-user-circle"></i></div>
                        <div class="patient-details">
                            <h2>${escapeHtml(rdv.patient_nom)}</h2>
                            <p><i class="fas fa-chart-line"></i> ${historique.length} consultation${historique.length > 1 ? 's' : ''} précédente${historique.length > 1 ? 's' : ''}</p>
                            <p><i class="fas fa-phone"></i> ${rdv.telephone || 'Non renseigné'}</p>
                            <p><i class="fas fa-envelope"></i> ${rdv.email || 'Non renseigné'}</p>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="far fa-calendar-alt"></i> Date et heure</h3>
                        <div class="info-card">
                            <div class="info-text">
                                <div class="value">${dateStr} à ${heureStr}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="far fa-clock"></i> Durée</h3>
                        <div class="info-card">
                            <div class="info-text">
                                <div class="value">${rdv.duree_min || 30} minutes</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-map-marker-alt"></i> Lieu</h3>
                        <div class="info-card">
                            <div class="info-text">
                                <div class="value">Cabinet - Campus Paris</div>
                            </div>
                        </div>
                    </div>
                    
                    ${historiqueHtml}
                    ${noteHtml}
                    
                    <div class="btn-actions">
                        <button class="btn-note" onclick="ouvrirModalNote()"><i class="fas fa-comment"></i> Ajouter une note</button>
                        <button class="btn-annuler" onclick="annulerRdv()"><i class="fas fa-times"></i> Annuler</button>
                    </div>
                </div>
            `;
        } catch (error) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:red;">Erreur: ${error.message}</div>`;
        }
    }

    function ouvrirModalNote() {
        document.getElementById('noteModal').classList.add('open');
        document.getElementById('noteText').value = '';
    }

    async function ajouterNote(event) {
        event.preventDefault();
        const note = document.getElementById('noteText').value.trim();
        
        if (!note) {
            alert("Veuillez écrire une note");
            return;
        }
        
        try {
            const res = await fetch('../backend/ajouter_note_rdv.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    reservation_id: rdvId,
                    commentaire: note
                })
            });
            const data = await res.json();
            
            if (data.success) {
                alert("Note ajoutée avec succès");
                document.getElementById('noteModal').classList.remove('open');
                chargerDetails();
            } else {
                alert("Erreur: " + data.error);
            }
        } catch (error) {
            alert("Erreur de connexion");
        }
    }

    async function annulerRdv() {
        if (!confirm("Annuler ce rendez-vous ?")) return;
        
        try {
            const res = await fetch(`../backend/annuler_rdv.php?id=${rdvId}`, {
                method: 'POST',
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success) {
                alert("Rendez-vous annulé");
                window.location.href = "agenda_praticien.html";
            } else {
                alert("Erreur: " + data.error);
            }
        } catch (error) {
            alert("Erreur de connexion");
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
