<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dossier patient - VitaCare Campus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_praticien.css">

</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">V</div>
            <span class="brand-name">VitaCare <small>Campus</small></span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard_praticien.html"><i class="fas fa-th-large"></i> Tableau de bord</a>
            <a href="calendar_praticien.html"><i class="fas fa-calendar-alt"></i> Agenda</a>
            <a href="disponibilites_praticien.html"><i class="fas fa-clock"></i> Disponibilités</a>
            <a href="patients_praticien.html" class="active"><i class="fas fa-users"></i> Patients</a>
            <a href="activites_praticien.html"><i class="fas fa-heart"></i> Activités</a>
        </nav>
        <div class="sidebar-footer">
            <div class="help-box">
                <div class="help-icon"><i class="fas fa-question"></i></div>
                <strong>Besoin d'aide ?</strong>
                <p>Notre équipe est là pour vous aider.</p>
                <a href="#">Nous contacter</a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-right">
                <div class="notif-dropdown-container" style="position:relative;">
                    <span class="icon-btn notif-bell" id="notif-bell" style="cursor:pointer; position:relative;">
                        <i class="fas fa-bell"></i>
                        <span id="topbar-notif-count" style="position:absolute; top:-8px; right:-8px; background:#ef4444; color:white; font-size:10px; padding:2px 6px; border-radius:999px; display:none;">0</span>
                    </span>
                    <div id="notif-dropdown" style="display:none; position:absolute; top:100%; right:0; width:380px; max-height:450px; background:white; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.15); border:1px solid #e5e7eb; z-index:1000; margin-top:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid #e5e7eb;">
                            <span style="font-weight:700; font-size:16px;">Notifications</span>
                            <button id="markAllReadBtn" style="background:transparent; border:none; color:#2e8b57; font-size:13px; font-weight:600; cursor:pointer;">Tout marquer comme lu</button>
                        </div>
                        <div id="notif-dropdown-list" style="max-height:320px; overflow-y:auto;">
                            <div style="padding:20px; text-align:center;">Chargement...</div>
                        </div>
                    </div>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="avatar-initials">MM</div>
                    <span class="user-name" id="user-name">Dr. Martin</span>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="dossier-header">
                <div class="dossier-header-left">
                    <button class="btn-back" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i> Retour
                    </button>
                    <div id="patientInfo" class="patient-info-header"></div>
                </div>
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" data-tab="consultations">Consultations</button>
                <button class="tab-btn" data-tab="activites">Activités</button>
                <button class="tab-btn" data-tab="commentaires">Commentaires</button>
            </div>

            <div id="tab-consultations" class="tab-panel active">
                <div id="consultationsList" class="historique-list"></div>
            </div>

            <div id="tab-activites" class="tab-panel">
                <div id="activitesList" class="historique-list"></div>
            </div>

            <div id="tab-commentaires" class="tab-panel">
                <div id="commentairesList" class="historique-list"></div>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div id="commentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-comment-medical"></i> Ajouter un commentaire</h2>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="commentForm">
            <input type="hidden" id="commentReservationId">
            <div class="form-group">
                <label>Commentaire</label>
                <textarea id="commentText" rows="5" placeholder="Notes sur la consultation, observations, recommandations..." required></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel-modal" id="cancelModalBtn">Annuler</button>
                <button type="submit" class="btn-submit">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script>
    let patientId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) { window.location.href = "login.html"; return; }
        document.getElementById("user-name").textContent = "Dr. " + user.nom;
        document.getElementById("avatar-initials").textContent = (user.prenom ? user.prenom[0] : "D") + user.nom[0];
        
        const urlParams = new URLSearchParams(window.location.search);
        patientId = urlParams.get('id');
        if (!patientId) { window.location.href = "patients_praticien.html"; return; }
        
        await chargerDossier();
        initNotifications();
        
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
                document.getElementById(`tab-${this.dataset.tab}`).classList.add("active");
            });
        });
        
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('commentModal').classList.remove('open');
        document.getElementById('cancelModalBtn').onclick = () => document.getElementById('commentModal').classList.remove('open');
        document.getElementById('commentForm').onsubmit = ajouterCommentaire;
        window.onclick = (event) => { if (event.target === document.getElementById('commentModal')) document.getElementById('commentModal').classList.remove('open'); };
    });

    async function chargerDossier() {
        try {
            const res = await fetch(`../backend/dossier_patient.php?id=${patientId}`, { credentials: 'include' });
            const data = await res.json();
            if (!data.success) { alert("Erreur: " + data.error); return; }
            
            document.getElementById('patientInfo').innerHTML = `<h2>${data.patient.prenom} ${data.patient.nom}</h2><p><i class="fas fa-envelope"></i> ${data.patient.email} | <i class="fas fa-phone"></i> ${data.patient.telephone || 'Non renseigné'}</p>`;
            
            afficherConsultations(data.consultations);
            afficherActivites(data.activites);
            afficherCommentaires(data.commentaires);
        } catch (error) { console.error(error); }
    }

    function afficherConsultations(consultations) {
        const container = document.getElementById('consultationsList');
        if (consultations.length === 0) { container.innerHTML = '<div class="empty-state">Aucune consultation</div>'; return; }
        container.innerHTML = consultations.map(cons => {
            const date = new Date(cons.date);
            const dateStr = date.toLocaleDateString('fr-FR');
            const heureStr = cons.heure_debut.substring(0,5);
            return `
                <div class="historique-item">
                    <div class="historique-date">${dateStr}</div>
                    <div class="historique-info">
                        <span class="historique-title">${cons.service_nom}</span>
                        <span class="historique-time">${heureStr}</span>
                        <span class="badge ${cons.statut === 'terminee' ? 'badge-termine' : 'badge-confirmed'}">${cons.statut === 'terminee' ? 'Terminée' : 'Confirmée'}</span>
                    </div>
                    <button class="btn-add-comment" onclick="ouvrirModalCommentaire(${cons.id}, '${dateStr}')">
                        <i class="fas fa-comment"></i> Ajouter un commentaire
                    </button>
                </div>
            `;
        }).join('');
    }

    function afficherActivites(activites) {
        const container = document.getElementById('activitesList');
        if (activites.length === 0) { container.innerHTML = '<div class="empty-state">Aucune activité inscrite</div>'; return; }
        container.innerHTML = activites.map(act => {
            const date = new Date(act.date_heure);
            const dateStr = date.toLocaleDateString('fr-FR');
            const heureStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            return `
                <div class="historique-item">
                    <div class="historique-date">${dateStr}</div>
                    <div class="historique-info">
                        <span class="historique-title">${act.activite_nom}</span>
                        <span class="historique-time">${heureStr}</span>
                        <span class="historique-lieu">${act.lieu}</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function afficherCommentaires(commentaires) {
        const container = document.getElementById('commentairesList');
        if (commentaires.length === 0) { container.innerHTML = '<div class="empty-state">Aucun commentaire</div>'; return; }
        container.innerHTML = commentaires.map(com => {
            const date = new Date(com.created_at);
            const dateStr = date.toLocaleDateString('fr-FR');
            const dateConsultation = new Date(com.date_consultation).toLocaleDateString('fr-FR');
            return `
                <div class="commentaire-item">
                    <div class="commentaire-header">
                        <span><i class="far fa-calendar"></i> ${dateStr}</span>
                        <span>Consultation du ${dateConsultation}</span>
                    </div>
                    <div class="commentaire-text">
                        <i class="fas fa-quote-left"></i>
                        <p>${escapeHtml(com.commentaire)}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function ouvrirModalCommentaire(reservationId, dateStr) {
        document.getElementById('commentReservationId').value = reservationId;
        document.getElementById('commentText').value = '';
        document.getElementById('commentModal').classList.add('open');
    }

    async function ajouterCommentaire(event) {
        event.preventDefault();
        const reservationId = document.getElementById('commentReservationId').value;
        const commentaire = document.getElementById('commentText').value.trim();
        if (!commentaire) { alert("Veuillez écrire un commentaire"); return; }
        try {
            const res = await fetch('../backend/ajouter_commentaire.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ reservation_id: reservationId, commentaire: commentaire })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('commentModal').classList.remove('open');
                await chargerDossier();
            } else { alert("Erreur: " + data.error); }
        } catch (error) { alert("Erreur de connexion"); }
    }

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    // ========== NOTIFICATIONS ==========
    function initNotifications() {
        const bell = document.getElementById('notif-bell');
        const dropdown = document.getElementById('notif-dropdown');
        const markAllBtn = document.getElementById('markAllReadBtn');
        
        chargerNotifications();
        
        if (bell && dropdown) {
            bell.addEventListener('click', function(e) {
                e.stopPropagation();
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                } else {
                    chargerNotifications();
                    dropdown.style.display = 'block';
                }
            });
            
            document.addEventListener('click', function(e) {
                if (!bell.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }
        
        if (markAllBtn) {
            markAllBtn.onclick = marquerToutLu;
        }
    }

    function chargerNotifications() {
        fetch('../backend/notifications.php', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const notifications = data.notifications;
                    const nonLues = notifications.filter(n => n.lu == 0).length;
                    const badge = document.getElementById('topbar-notif-count');
                    if (badge) {
                        if (nonLues > 0) {
                            badge.textContent = nonLues;
                            badge.style.display = 'block';
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                    afficherNotifications(notifications);
                }
            })
            .catch(err => console.error("Erreur:", err));
    }

    function afficherNotifications(notifications) {
        const container = document.getElementById('notif-dropdown-list');
        if (!container) return;
        
        if (notifications.length === 0) {
            container.innerHTML = '<div style="padding:20px; text-align:center; color:#9ca3af;">Aucune notification</div>';
            return;
        }
        
        const recentes = [...notifications].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
        
        container.innerHTML = recentes.map(notif => {
            const estLu = notif.lu == 1;
            let bgColor = '#e5e7eb';
            let iconColor = '#4b5563';
            let iconFa = 'fa-info-circle';
            
            if (notif.type === 'rappel') {
                bgColor = '#fef3c7';
                iconColor = '#d97706';
                iconFa = 'fa-bell';
            } else if (notif.type === 'confirmation') {
                bgColor = '#d1fae5';
                iconColor = '#065f46';
                iconFa = 'fa-check-circle';
            } else if (notif.type === 'annulation') {
                bgColor = '#fee2e2';
                iconColor = '#dc2626';
                iconFa = 'fa-times-circle';
            }
            
            const date = new Date(notif.date);
            const dateStr = date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'numeric' });
            const heureStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            
            const titre = notif.message.length > 50 ? notif.message.substring(0, 50) + '...' : notif.message;
            
            return `
                <div onclick="marquerCommeLu(${notif.id})" style="padding:12px 18px; display:flex; gap:12px; cursor:pointer; border-bottom:1px solid #f0f4f9; ${!estLu ? 'background:#eaf7f4;' : ''}">
                    <div style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; background:${bgColor}; color:${iconColor}">
                        <i class="fas ${iconFa}"></i>
                    </div>
                    <div style="flex:1">
                        <div style="font-weight:600; font-size:14px; color:#1f2937; margin-bottom:4px;">${escapeHtml(titre)}</div>
                        <div style="font-size:12px; color:#6b7280;">${escapeHtml(notif.message.substring(0, 80))}</div>
                        <div style="font-size:11px; color:#9ca3af; margin-top:4px;">${dateStr} à ${heureStr}</div>
                    </div>
                    ${!estLu ? '<div style="width:8px; height:8px; border-radius:50%; background:#2e8b57; margin-top:12px;"></div>' : ''}
                </div>
            `;
        }).join('');
        
        container.innerHTML += `
            <div style="padding:12px 18px; text-align:center; border-top:1px solid #e5e7eb;">
                <a href="notifications_praticien.html" style="color:#2e8b57; text-decoration:none; font-weight:600;">Voir toutes les notifications →</a>
            </div>
        `;
    }

    function marquerCommeLu(id) {
        fetch('../backend/marquer_notification_lu.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ id: id })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                chargerNotifications();
            }
        })
        .catch(err => console.error("Erreur:", err));
    }

    function marquerToutLu() {
        fetch('../backend/marquer_tout_lu.php', {
            method: 'POST',
            credentials: 'include'
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                chargerNotifications();
            }
        })
        .catch(err => console.error("Erreur:", err));
    }
</script>

</body>
</html>
