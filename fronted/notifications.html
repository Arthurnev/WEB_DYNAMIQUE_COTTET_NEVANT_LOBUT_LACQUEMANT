<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - VitaCare</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">V</div>
            <span class="brand-name">VitaCare <small>Campus</small></span>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="catalogue.html"><i class="fas fa-book-open"></i> Catalogue</a>
            <a href="suivi_historique.html"><i class="fas fa-calendar-check"></i> Suivi & historique</a>
            <a href="activites.html"><i class="fas fa-heart"></i> Activités</a>
            <a href="notifications.html" class="active"><i class="fas fa-bell"></i> Notifications <span class="badge" id="sidebar-notif-count">3</span></a>
        </nav>

        <div class="sidebar-footer">
            <div class="help-box">
                <div class="help-icon"><i class="fas fa-question"></i></div>
                <strong>Besoin d'aide ?</strong>
                <p>Notre équipe est là pour vous aider.</p>
                <a href="#">Nous contacter</a>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">

        <!-- Topbar avec menu déroulant -->
        <header class="topbar">
            <div class="topbar-right">
                <!-- MENU DÉROULANT NOTIFICATIONS -->
                <div class="notif-dropdown-container">
                    <span class="icon-btn notif-bell" id="notif-bell">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="topbar-notif-count">3</span>
                    </span>
                    <div class="notif-dropdown" id="notif-dropdown">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button onclick="marquerToutLuDropdown()">Tout marquer comme lu</button>
                        </div>
                        <div class="notif-dropdown-list" id="notif-dropdown-list">
                            <!-- Rempli dynamiquement par JS -->
                        </div>
                        <div class="notif-dropdown-footer">
                            <a href="notifications.html">Voir toutes les notifications</a>
                        </div>
                    </div>
                </div>
                
                <span class="icon-btn"><i class="fas fa-shopping-cart"></i></span>
                <div class="user-profile">
                    <div class="avatar">JD</div>
                    <span class="user-name" id="user-name">Jean Dupont</span>
                </div>
            </div>
        </header>

        <!-- Page content -->
        <div class="page-content">

            <!-- Page header -->
            <div class="page-header">
                <h1>Notifications</h1>
                <p class="subtitle" id="unread-count">3 notifications non lues</p>
            </div>

            <!-- Filter tabs -->
            <div class="notif-filters-container">
                <div class="notif-filters">
                    <button class="filter-btn active" data-filter="all">Toutes</button>
                    <button class="filter-btn" data-filter="rappel">Rappels</button>
                    <button class="filter-btn" data-filter="confirmation">Confirmations</button>
                    <button class="filter-btn" data-filter="annulation">Annulations</button>
                    <button class="filter-btn" data-filter="nouveaute">Nouveautés</button>
                </div>
                <button class="mark-all-read" onclick="marquerToutLuPage()">Tout marquer comme lu</button>
            </div>

            <!-- Notifications list -->
            <div id="notifications-list" class="notif-list">
                <!-- Rempli dynamiquement par JS -->
            </div>

        </div>

    </main>

</div>

<script src="../js/notifications.js"></script>
</body>
</html>
