<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Détails de l'activité - VitaCare Campus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_praticien.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">V</div>
            <span class="brand-name">VitaCare <small>Campus</small></span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard_praticien.html"><i class="fas fa-th-large"></i> Tableau de bord</a>
            <a href="agenda_praticien.html" class="active"><i class="fas fa-calendar-alt"></i> Agenda</a>
            <a href="disponibilites_praticien.html"><i class="fas fa-clock"></i> Disponibilités</a>
            <a href="patients_praticien.html"><i class="fas fa-users"></i> Patients</a>
            <a href="activites_praticien.html"><i class="fas fa-heart"></i> Activités</a>
        </nav>
        <div class="sidebar-footer">
            <div class="help-box">
                <div class="help-icon"><i class="fas fa-question"></i></div>
                <strong>Besoin d'aide ?</strong>
                <p>Notre équipe est là pour vous aider.</p>
                <a href="#">Nous contacter</a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-right">
                <span class="icon-btn"><i class="fas fa-bell"></i></span>
                <div class="user-profile">
                    <div class="avatar" id="avatar-initials">MM</div>
                    <span class="user-name" id="user-name">Dr. Martin</span>
                </div>
            </div>
        </header>

        <div class="page-content">
            <button class="btn-back" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Retour à l'agenda
            </button>

            <div id="detailContainer" class="detail-container">
                <div style="text-align:center; padding:40px;">Chargement...</div>
            </div>
        </div>
    </main>
</div>

<script>
    let activiteId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        document.getElementById("user-name").textContent = "Dr. " + user.nom;
        document.getElementById("avatar-initials").textContent = (user.prenom ? user.prenom[0] : "D") + user.nom[0];
        
        const urlParams = new URLSearchParams(window.location.search);
        activiteId = urlParams.get('id');
        
        if (!activiteId) {
            window.location.href = "agenda_praticien.html";
            return;
        }
        
        await chargerDetails();
    });

    async function chargerDetails() {
        const container = document.getElementById('detailContainer');
        try {
            const res = await fetch(`../backend/details_activite.php?id=${activiteId}`, { credentials: 'include' });
            const data = await res.json();
            
            if (!data.success) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:red;">Erreur: ${data.error}</div>`;
                return;
            }
            
            const activite = data.activite;
            const inscrits = data.inscrits || [];
            
            const date = new Date(activite.date_heure);
            const dateStr = date.toLocaleDateString('fr-FR');
            const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const percent = inscrits.length > 0 ? (inscrits.length / activite.capacite_max) * 100 : 0;
            
            let inscritsHtml = '';
            if (inscrits.length > 0) {
                inscritsHtml = `
                    <div class="info-section">
                        <h3><i class="fas fa-users"></i> Inscrits (${inscrits.length}/${activite.capacite_max})</h3>
                        <div class="progress-bar-container">
                            <div class="progress-fill" style="width: ${percent}%;"></div>
                        </div>
                        <div class="inscrits-list">
                            ${inscrits.map(i => `
                                <div class="inscrit-item">
                                    <span class="inscrit-name">${escapeHtml(i.prenom)} ${escapeHtml(i.nom)}</span>
                                    <span class="inscrit-email">${escapeHtml(i.email)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                inscritsHtml = `
                    <div class="info-section">
                        <h3><i class="fas fa-users"></i> Inscrits</h3>
                        <div class="empty-inscrits">
                            <i class="fas fa-user-plus"></i>
                            <p>Aucun inscrit pour le moment</p>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = `
                <div class="detail-header">
                    <h1>${escapeHtml(activite.nom)}</h1>
                    <p>${escapeHtml(activite.description || 'Aucune description')}</p>
                </div>
                <div class="detail-body">
                    <div class="info-section">
                        <h3><i class="far fa-calendar-alt"></i> Date et heure</h3>
                        <div class="info-card">
                            <div class="info-text">
                                <div class="value">${dateStr} à ${timeStr}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-map-marker-alt"></i> Lieu</h3>
                        <div class="info-card">
                            <div class="info-text">
                                <div class="value">${escapeHtml(activite.lieu)}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-users"></i> Capacité</h3>
                        <div class="info-card">
                            <div class="info-text">
                                <div class="value">${activite.capacite_max} personnes</div>
                            </div>
                        </div>
                    </div>
                    
                    ${inscritsHtml}
                </div>
            `;
        } catch (error) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:red;">Erreur: ${error.message}</div>`;
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
