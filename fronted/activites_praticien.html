<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mes activités - VitaCare Campus | Dr. Martin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_praticien.css">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">V</div>
            <span class="brand-name">VitaCare <small>Campus</small></span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard_praticien.html"><i class="fas fa-th-large"></i> Tableau de bord</a>
            <a href="agenda_praticien.html"><i class="fas fa-calendar-alt"></i> Agenda</a>
            <a href="disponibilites_praticien.html"><i class="fas fa-clock"></i> Disponibilités</a>
            <a href="patients_praticien.html"><i class="fas fa-users"></i> Patients</a>
            <a href="activites_praticien.html" class="active"><i class="fas fa-heart"></i> Activités</a>
        </nav>

        <div class="sidebar-footer">
            <div class="help-box">
                <div class="help-icon"><i class="fas fa-question"></i></div>
                <strong>Besoin d'aide ?</strong>
                <p>Notre équipe est là pour vous aider.</p>
                <a href="#">Nous contacter</a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-right">
                <span class="icon-btn"><i class="fas fa-bell"></i></span>
                <div class="user-profile">
                    <div class="avatar" id="avatar-initials">MM</div>
                    <span class="user-name" id="user-name">Dr. Martin</span>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="activities-header">
                <div>
                    <h1>Mes activités</h1>
                    <p class="subtitle">Gérez vos ateliers et activités proposés aux étudiants</p>
                </div>
                <button class="btn-create" id="openModalBtn">
                    <i class="fas fa-plus"></i> Créer une activité
                </button>
            </div>

            <div id="activitiesContainer" class="activities-grid">
                <div style="text-align:center; padding:40px;">Chargement...</div>
            </div>
        </div>
    </main>
</div>

<!-- Modal création activité -->
<div id="activityModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-plus-circle"></i> Nouvelle activité</h2>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="activityForm">
            <div class="form-group">
                <label>Titre de l'activité *</label>
                <input type="text" id="activityTitle" required placeholder="Ex: Atelier gestion du stress">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="activityDesc" rows="3" placeholder="Décrivez votre activité..."></textarea>
            </div>
            <div class="form-group">
                <label>Date *</label>
                <input type="date" id="activityDate" required>
            </div>
            <div class="form-group">
                <label>Heure *</label>
                <input type="time" id="activityTime" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Durée (minutes)</label>
                    <input type="number" id="activityDuration" value="60" min="15" step="15">
                </div>
                <div class="form-group">
                    <label>Lieu *</label>
                    <input type="text" id="activityLocation" required placeholder="Salle A">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" id="activityPrice" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>Capacité max *</label>
                    <input type="number" id="activityCapacity" value="20" required min="1">
                </div>
            </div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="activityCategory">
                    <option value="Bien-être">Bien-être</option>
                    <option value="Sport & Fitness">Sport & Fitness</option>
                    <option value="Nutrition">Nutrition</option>
                    <option value="Méditation">Méditation</option>
                    <option value="Atelier">Atelier</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel-modal" id="cancelModalBtn">Annuler</button>
                <button type="submit" class="btn-submit">Publier l'activité</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal voir inscrits -->
<div id="inscritsModal" class="modal">
    <div class="modal-content" style="max-width: 550px;">
        <div class="modal-header">
            <h2><i class="fas fa-users"></i> Liste des inscrits</h2>
            <button class="modal-close" id="closeInscritsModalBtn">&times;</button>
        </div>
        <div id="inscritsList" style="max-height: 400px; overflow-y: auto;">
            <div style="text-align:center; padding:20px;">Chargement...</div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        currentUser = user;
        document.getElementById("user-name").textContent = "Dr. " + user.nom;
        document.getElementById("avatar-initials").textContent = (user.prenom ? user.prenom[0] : "D") + user.nom[0];
        
        await chargerActivites();
        
        document.getElementById('openModalBtn').onclick = openModal;
        document.getElementById('closeModalBtn').onclick = closeModal;
        document.getElementById('cancelModalBtn').onclick = closeModal;
        document.getElementById('closeInscritsModalBtn').onclick = closeInscritsModal;
        document.getElementById('activityForm').onsubmit = ajouterActivite;
        
        window.onclick = (event) => {
            if (event.target === document.getElementById('activityModal')) closeModal();
            if (event.target === document.getElementById('inscritsModal')) closeInscritsModal();
        };
    });

    async function chargerActivites() {
        const container = document.getElementById('activitiesContainer');
        try {
            const res = await fetch('../backend/lister_activites.php', { credentials: 'include' });
            const data = await res.json();
            
            if (!data.success) {
                container.innerHTML = `<div class="empty-activities"><p>Erreur: ${data.error}</p></div>`;
                return;
            }
            
            const activites = data.activites;
            
            if (activites.length === 0) {
                container.innerHTML = `
                    <div class="empty-activities">
                        <i class="fas fa-calendar-plus"></i>
                        <p>Vous n'avez pas encore créé d'activité</p>
                        <button class="btn-create" onclick="document.getElementById('openModalBtn').click()">
                            <i class="fas fa-plus"></i> Créer une activité
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = activites.map(activite => {
                const date = new Date(activite.date_heure);
                const dateStr = date.toLocaleDateString('fr-FR');
                const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                const today = new Date();
                const estActif = new Date(activite.date_heure) > today;
                const statusClass = estActif ? 'status-active' : 'status-completed';
                const statusLabel = estActif ? 'Actif' : 'Terminé';
                const inscrits = activite.inscrits || 0;
                const percent = (inscrits / activite.capacite_max) * 100;
                const prixText = activite.prix == 0 ? 'Gratuit' : activite.prix + ' €';
                
                return `
                    <div class="activity-card">
                        <div class="activity-card-header">
                            <div class="activity-title">${escapeHtml(activite.nom)}</div>
                            <div class="activity-status ${statusClass}">${statusLabel}</div>
                            <div class="activity-desc">${escapeHtml(activite.description || 'Aucune description')}</div>
                        </div>
                        <div class="activity-card-body">
                            <div class="activity-details">
                                <div class="detail-item"><i class="far fa-calendar-alt"></i><span>${dateStr} à ${timeStr}</span></div>
                                <div class="detail-item"><i class="fas fa-map-marker-alt"></i><span>${escapeHtml(activite.lieu)}</span></div>
                                <div class="detail-item"><i class="fas fa-tag"></i><span>${prixText}</span></div>
                                <div class="detail-item"><i class="fas fa-users"></i><span>Capacité: ${activite.capacite_max} personnes</span></div>
                            </div>
                            <div class="inscription-info">
                                <div class="inscrits-count">${inscrits}/${activite.capacite_max} inscrits</div>
                                <div class="progress-bar-container"><div class="progress-fill" style="width: ${percent}%;"></div></div>
                            </div>
                        </div>
                        <div class="activity-card-footer">
                            <button class="btn-view" onclick="voirInscrits(${activite.id})"><i class="fas fa-users"></i> Voir les inscrits</button>
                            <button class="btn-delete" onclick="supprimerActivite(${activite.id})"><i class="fas fa-trash-alt"></i> Supprimer</button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (error) {
            container.innerHTML = `<div class="empty-activities"><p>Erreur: ${error.message}</p></div>`;
        }
    }

    async function voirInscrits(activiteId) {
        const modal = document.getElementById('inscritsModal');
        const container = document.getElementById('inscritsList');
        
        modal.classList.add('open');
        container.innerHTML = '<div style="text-align:center; padding:20px;">Chargement...</div>';
        
        try {
            const res = await fetch(`../backend/lister_inscrits.php?activite_id=${activiteId}`, { credentials: 'include' });
            const data = await res.json();
            
            if (!data.success) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:red;">Erreur: ${data.error}</div>`;
                return;
            }
            
            const inscrits = data.inscrits;
            
            if (inscrits.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px;">Aucun inscrit pour cette activité</div>';
                return;
            }
            
            let html = '<table style="width:100%; border-collapse:collapse;">';
            html += '<thead><tr style="border-bottom:1px solid #e5e7eb;">';
            html += '<th style="text-align:left; padding:10px;">Nom</th>';
            html += '<th style="text-align:left; padding:10px;">Prénom</th>';
            html += '<th style="text-align:left; padding:10px;">Email</th>';
            html += '<th style="text-align:left; padding:10px;">Inscrit le</th>';
            html += '</tr></thead><tbody>';
            
            inscrits.forEach(i => {
                const dateInscrit = new Date(i.date_inscription).toLocaleDateString('fr-FR');
                html += `<tr style="border-bottom:1px solid #f0f4f9;">`;
                html += `<td style="padding:10px;">${escapeHtml(i.nom)}</td>`;
                html += `<td style="padding:10px;">${escapeHtml(i.prenom)}</td>`;
                html += `<td style="padding:10px;">${escapeHtml(i.email)}</td>`;
                html += `<td style="padding:10px;">${dateInscrit}</td>`;
                html += `</tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:red;">Erreur: ${error.message}</div>`;
        }
    }

    function closeInscritsModal() {
        document.getElementById('inscritsModal').classList.remove('open');
    }

    async function ajouterActivite(event) {
        event.preventDefault();
        
        const titre = document.getElementById('activityTitle').value.trim();
        const description = document.getElementById('activityDesc').value.trim();
        const date = document.getElementById('activityDate').value;
        const time = document.getElementById('activityTime').value;
        const lieu = document.getElementById('activityLocation').value.trim();
        const capacite = parseInt(document.getElementById('activityCapacity').value);
        
        if (!titre || !date || !time || !lieu || !capacite) {
            showToast('Veuillez remplir tous les champs obligatoires', 'error');
            return;
        }
        
        try {
            const res = await fetch('../backend/ajouter_activite.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    nom: titre,
                    description: description,
                    date_heure: `${date} ${time}:00`,
                    lieu: lieu,
                    capacite_max: capacite
                })
            });
            const data = await res.json();
            
            if (data.success) {
                showToast('Activité créée avec succès !', 'success');
                closeModal();
                document.getElementById('activityForm').reset();
                await chargerActivites();
            } else {
                showToast('Erreur: ' + data.error, 'error');
            }
        } catch (error) {
            showToast('Erreur de connexion', 'error');
        }
    }

    async function supprimerActivite(id) {
        if (!confirm('Supprimer cette activité ?')) return;
        
        try {
            const res = await fetch(`../backend/supprimer_activite.php?id=${id}`, { credentials: 'include' });
            const data = await res.json();
            
            if (data.success) {
                showToast('Activité supprimée', 'success');
                await chargerActivites();
            } else {
                showToast('Erreur: ' + data.error, 'error');
            }
        } catch (error) {
            showToast('Erreur de connexion', 'error');
        }
    }

    function openModal() {
        const modal = document.getElementById('activityModal');
        modal.classList.add('open');
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 7);
        document.getElementById('activityDate').value = defaultDate.toISOString().split('T')[0];
        document.getElementById('activityTime').value = '14:00';
        document.getElementById('activityDuration').value = '60';
        document.getElementById('activityPrice').value = '0';
        document.getElementById('activityCapacity').value = '20';
    }

    function closeModal() {
        document.getElementById('activityModal').classList.remove('open');
        document.getElementById('activityForm').reset();
    }

    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

<style>
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 12px 24px;
        border-radius: 40px;
        color: white;
        font-weight: 600;
        z-index: 1100;
        animation: slideIn 0.3s ease;
    }
    .toast.success { background: #2e8b57; }
    .toast.error { background: #dc2626; }
    .toast i { margin-right: 8px; }
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>

</body>
</html>
